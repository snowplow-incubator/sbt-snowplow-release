# Smoke-test overrides. Every rule here is asserted by smokeRun (driver JVM)
# and/or executorProbe (the k8s executor path).

# Level override, both JVMs: SecurityManager logs several INFO lines at startup
# in the driver and in every executor.
logger.secmgr.name = org.apache.spark.SecurityManager
logger.secmgr.level = warn

# RegexFilter, executor: drop only the HUP line of the three
# "Registering signal handler for ..." lines; TERM and INT must stay.
logger.signal.name = org.apache.spark.util.SignalUtils
logger.signal.filter.hup.type = RegexFilter
logger.signal.filter.hup.regex = .*for HUP
logger.signal.filter.hup.onMatch = DENY
logger.signal.filter.hup.onMismatch = NEUTRAL

# RegexFilter, driver: drop only the "Running Spark version" line; other
# SparkContext INFO lines must stay. The \\d is a properties-file escape for
# the regex \d, proving the file reaches log4j2 untouched.
logger.sparkcontext.name = org.apache.spark.SparkContext
logger.sparkcontext.filter.version.type = RegexFilter
logger.sparkcontext.filter.version.regex = Running Spark version \\d.*
logger.sparkcontext.filter.version.onMatch = DENY
logger.sparkcontext.filter.version.onMismatch = NEUTRAL
